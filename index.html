<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Box</title>

    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: #161b22;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #30363d;
        }

        h1 {
            color: #00ffcc;
            text-align: center;
        }

        pre {
            background: #010409;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 15px;
            line-height: 1.6;
            color: #00ffcc;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00ccaa;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Code Box</h1>

    <pre><code id="code">addCoins = function(amount) {
        return typeof log != 'undefined' && log !== null ? log.log({
            event: "adjustCoins",
            value: amount
        }) : void 8;
    };
addCoins(42)</code></pre>

    <button onclick="copyCode()">Code kopieren</button>
</div>

<script>
    function copyCode() {
        const code = document.getElementById("code").textContent;

        navigator.clipboard.writeText(code).then(() => {
            alert("Code erfolgreich kopiert!");
        });
    }
</script>

</body>
</html>
